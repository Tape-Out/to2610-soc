name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      dep_refs:
        description: 依赖取哪个分支（空格分隔的 仓=分支），不写取各仓的默认分支。依赖的提交还没并进它的主分支时，先对着它验一遍
        default: ''
jobs:
  ip:
    uses: Tape-Out/.github/.github/workflows/ip.yml@main
    permissions:
      contents: write
    with:
      # 整片测试：ran asic 用 sv2v 与 yosys 展平出交付的 .v，测试台跑在 Verilator 上，程序用裸机的 RISC-V GCC 编；
      # Linux 镜像先在 QEMU 上过一遍
      apt: yosys verilator iverilog busybox-static gcc-riscv64-unknown-elf qemu-system-riscv
      pip: pyyaml
      sv2v: v0.0.13
      dep-refs: ${{ inputs.dep_refs }}
      # 整片测试把 Linux 那一段的仿真器、镜像与脚本留给后面的接力
      keep: build/linux-run
  # Linux 起到 shell 要十个小时上下：六棒接力，每棒跑满四个半小时交断点，走完了余下的棒直接收工。
  # 仿真器是整片测试编好交过来的，yosys 与 sv2v 是给每个作业开头都要跑的 setup（拼源码树）用的
  linux-1:
    needs: ip
    uses: Tape-Out/.github/.github/workflows/ip.yml@main
    permissions:
      contents: write
    with:
      apt: yosys verilator
      pip: pyyaml
      sv2v: v0.0.13
      dep-refs: ${{ inputs.dep_refs }}
      tasks: linux-boot
      restore: build/linux-run
      keep: build/linux-run
      stage: linux-1
  linux-2:
    needs: linux-1
    uses: Tape-Out/.github/.github/workflows/ip.yml@main
    permissions:
      contents: write
    with:
      apt: yosys verilator
      pip: pyyaml
      sv2v: v0.0.13
      dep-refs: ${{ inputs.dep_refs }}
      tasks: linux-boot
      restore: build/linux-run
      from: linux-1
      keep: build/linux-run
      stage: linux-2
  linux-3:
    needs: linux-2
    uses: Tape-Out/.github/.github/workflows/ip.yml@main
    permissions:
      contents: write
    with:
      apt: yosys verilator
      pip: pyyaml
      sv2v: v0.0.13
      dep-refs: ${{ inputs.dep_refs }}
      tasks: linux-boot
      restore: build/linux-run
      from: linux-2
      keep: build/linux-run
      stage: linux-3
  linux-4:
    needs: linux-3
    uses: Tape-Out/.github/.github/workflows/ip.yml@main
    permissions:
      contents: write
    with:
      apt: yosys verilator
      pip: pyyaml
      sv2v: v0.0.13
      dep-refs: ${{ inputs.dep_refs }}
      tasks: linux-boot
      restore: build/linux-run
      from: linux-3
      keep: build/linux-run
      stage: linux-4
  linux-5:
    needs: linux-4
    uses: Tape-Out/.github/.github/workflows/ip.yml@main
    permissions:
      contents: write
    with:
      apt: yosys verilator
      pip: pyyaml
      sv2v: v0.0.13
      dep-refs: ${{ inputs.dep_refs }}
      tasks: linux-boot
      restore: build/linux-run
      from: linux-4
      keep: build/linux-run
      stage: linux-5
  linux-6:
    needs: linux-5
    uses: Tape-Out/.github/.github/workflows/ip.yml@main
    permissions:
      contents: write
    with:
      apt: yosys verilator
      pip: pyyaml
      sv2v: v0.0.13
      dep-refs: ${{ inputs.dep_refs }}
      tasks: linux-boot
      restore: build/linux-run
      from: linux-5
      keep: build/linux-run
      stage: linux-6
  # 起到 shell 之后的各层从最后一棒交出的断点接着跑，一层一个作业，同时跑
  linux-onchip:
    needs: linux-6
    uses: Tape-Out/.github/.github/workflows/ip.yml@main
    permissions:
      contents: write
    with:
      apt: yosys verilator
      pip: pyyaml
      sv2v: v0.0.13
      dep-refs: ${{ inputs.dep_refs }}
      tasks: linux-onchip
      restore: build/linux-run
      from: linux-6
      stage: linux-onchip
  linux-sdcard:
    needs: linux-6
    uses: Tape-Out/.github/.github/workflows/ip.yml@main
    permissions:
      contents: write
    with:
      apt: yosys verilator gcc-riscv64-unknown-elf
      pip: pyyaml
      sv2v: v0.0.13
      dep-refs: ${{ inputs.dep_refs }}
      tasks: linux-sdcard
      restore: build/linux-run
      from: linux-6
      stage: linux-sdcard
  linux-network:
    needs: linux-6
    uses: Tape-Out/.github/.github/workflows/ip.yml@main
    permissions:
      contents: write
    with:
      apt: yosys verilator gcc-riscv64-unknown-elf
      pip: pyyaml
      sv2v: v0.0.13
      dep-refs: ${{ inputs.dep_refs }}
      tasks: linux-network
      restore: build/linux-run
      from: linux-6
      stage: linux-network
  linux-netjoin:
    needs: linux-6
    uses: Tape-Out/.github/.github/workflows/ip.yml@main
    permissions:
      contents: write
    with:
      # switch 与 router 的联合仿真：iverilog 加 cocotb
      apt: yosys verilator iverilog gcc-riscv64-unknown-elf
      pip: pyyaml cocotb==1.9.2
      sv2v: v0.0.13
      dep-refs: ${{ inputs.dep_refs }}
      tasks: linux-netjoin
      restore: build/linux-run
      from: linux-6
      stage: linux-netjoin
  linux-netinet:
    needs: linux-6
    uses: Tape-Out/.github/.github/workflows/ip.yml@main
    permissions:
      contents: write
    with:
      # 宿主机那一头：FastAPI 的页面与只答 lab.test 的 dnsmasq，都只听 TAP 网卡
      apt: yosys verilator iverilog gcc-riscv64-unknown-elf dnsmasq-base
      pip: pyyaml cocotb==1.9.2 fastapi uvicorn
      sv2v: v0.0.13
      dep-refs: ${{ inputs.dep_refs }}
      tasks: linux-netinet
      restore: build/linux-run
      from: linux-6
      stage: linux-netinet
