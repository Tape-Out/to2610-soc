name: to2610-soc
version: 0.1.0
spec: '0.1'
kind: ip
lang: verilog
identity:
  slug: to2610-soc
  display_name: Linux system chip with the catalogue's peripherals
  summary: 'A Linux system chip for the ECOS 2610 shuttle: the KianV RV32IMA Sv32 SoC of to2610-kvc with a window of its address map opened onto a block of peripherals assembled from the catalogue.'
  category: soc
  subcategories:
  - riscv
  ip_family: kianriscv
  integration_profile: []
  maturity: simulated
contract:
  version: 1
  ctrl:
    shape: none
    aw: 32
    dw: 32
deps:
  gf180mcu-kianv-rv32ima-sv32: ^0.1
  to2610-kvc: ^0.1
  hwcore: ^0.1
  amba: ^0.1
  uart: ^0.1
  gpio: ^0.1
  timer: ^0.1
  wdt: ^0.1
  rtc: ^0.1
  i2c: ^0.1
  spi: ^0.1
  onew: ^0.1
  i2s: ^0.1
  can: ^0.1
  ps2: ^0.1
  rng: ^0.1
  emac: ^0.1
  pwm: ^0.1
  crc: ^0.1
  serdes: ^0.1
emit:
- kind: foreign
  lang: sv
  top: soc_frame
  # 源码树是拼出来的：上游 SoC 套一个补丁，加息壤装配出来的外设块与本仓的几个模块
  setup: src
  rtl:
  - build/src/chip_core.sv
  - { glob: "build/src/*.v" }
  - build/src/sdram/mt48lc16m16a2_ctrl.v
  - { glob: "build/src/kianv_harris_edition/*.v" }
  includes:
  - build/src
  - build/src/kianv_harris_edition
  # 与 to2610-kvc 交付的那一颗同一组取值
  defines:
    SYSTEM_CLK: 50000000
    NUM_ENTRIES_ITLB: 32
    NUM_ENTRIES_DTLB: 32
    TRP_NS: 15
    TRCD_NS: 15
    TRFC_NS: 66
    TWR_NS: 15
    CAS: 2
    TREFI_NS: 7800
    BYPASS_CACHES: 1
    SYNTHESIS: 1
  clock:
    port: clk
  reset:
    port: rst_n
    active: low
    sync: false
  ports:
  - endpoint: pads
    kind: physical
    type: SocPads
    map:
      i: bidir_in
      o: bidir_out
      oe: bidir_oe
  - endpoint: xpads
    kind: physical
    type: SocXPads
    map:
      i: x_in
      o: x_out
      oe: x_oe
  limits:
  - 缓存旁路、SDRAM 固定 32 MiB、主频固定 50 MHz，同 to2610-kvc
  - 没有 JTAG，调试靠串口
asic:
  top: to2610_soc
  frame: mpc
  mhz: 50
  flow: syn_sta
  # 前 54 位与 to2610-kvc 逐位相同：两颗用同一块底板；余下 12 位是窗后面的外设，排法在 hwsrc/soc_frame.v
  pads:
  - { in: bidir_in, out: bidir_out, oe: bidir_oe }
  - { in: x_in, out: x_out, oe: x_oe }
tasks:
  src:
    desc: 拼源码树：上游 KianV SoC 套上 patch/soc.patch，加息壤把 soc-io 装配出来的外设块、serdes 的模块与本仓 hwsrc 里的模块
    run: bash htest/setup.sh {{dep.gf180mcu-kianv-rv32ima-sv32}} {{dep.serdes}}
  sdm:
    desc: 数字式 ADC 与 DAC 的单元测试：原样要过，八处埋错每处都要红
    run: bash htest/sdm.sh {{out}} {{dep.to2610-kvc}}
    timeout: 900
  clkctl:
    desc: 时钟控制配上 PLL 的行为模型与 SerDes，两颗对接：原样要过，九处埋错每处都要红
    run: bash htest/clkctl.sh {{out}} {{dep.serdes}} {{dep.to2610-kvc}}
    timeout: 3600
  onchip-scripts:
    desc: sw 里在芯片上用的脚本拿假的 devmem 在主机上过一遍：原样要过，六处埋错每处都要红
    run: bash htest/onchip-scripts.sh {{out}}
    timeout: 600
  pin-faults:
    desc: 把 soc_frame.v 里的脚逐根接错、重出 .v：整片测试里管那根脚的那一句要红，十八处
    run: bash htest/pin-faults.sh {{out}} {{dep.gf180mcu-kianv-rv32ima-sv32}} {{dep.to2610-kvc}}
    timeout: 9000
  chip:
    desc: 出流片的 .v，在它上面跑 to2610-kvc 的各段（裸机、riscv-tests、FreeRTOS、Linux）与外设的裸机测试
    run: bash htest/chip.sh {{out}} {{dep.gf180mcu-kianv-rv32ima-sv32}} {{dep.to2610-kvc}}
    timeout: 14400
test:
  upstream:
  - { name: sdm, task: sdm, timeout: 900 }
  - { name: clkctl, task: clkctl, timeout: 3600 }
  - { name: onchip-scripts, task: onchip-scripts, timeout: 600 }
  - { name: chip, task: chip, timeout: 14400 }
  - { name: pin-faults, task: pin-faults, timeout: 9000 }
targets:
  foreign:
    driver: foreign
